name: Release

# Manual trigger only, from main. The job validates → tests → builds all
# platforms → generates release notes → creates the tag and the GitHub
# release in one pass. The tag only comes into existence after everything
# else has succeeded.
#
# Release notes are AI-generated by ledger (@anishhs/ledger) from the commits
# and diffs since the previous tag; for the FIRST release there is no previous
# tag, so notes are generated from the repository's root commit. If generation
# fails for any reason, the CHANGELOG entry for the version is used, and
# failing that, GitHub's auto-generated notes — notes can never block a release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (stable) or 1.1.0-beta.1 (prerelease)"
        required: true
        type: string
      dist-tag:
        description: "Release channel: 'latest' for stable, 'beta' for a prerelease"
        type: choice
        options: [latest, beta]
        default: latest

# One release at a time; never cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tag + release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate ref and inputs
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/heads/main) ;;
            *) echo "::error::Releases are cut from main only (got ${{ github.ref }})."; exit 1 ;;
          esac

          VERSION="${{ inputs.version }}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$VERSION' is not MAJOR.MINOR.PATCH[-prerelease]"; exit 1; }

          # Channel consistency: prereleases never ship as 'latest', stable
          # versions never ship as 'beta'.
          if [[ "$VERSION" == *-* && "${{ inputs.dist-tag }}" == "latest" ]]; then
            echo "::error::$VERSION is a prerelease — use dist-tag 'beta'."; exit 1
          fi
          if [[ "$VERSION" != *-* && "${{ inputs.dist-tag }}" == "beta" ]]; then
            echo "::error::$VERSION is stable — use dist-tag 'latest'."; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags — ledger derives the notes range

      - name: Refuse an existing tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ inputs.version }} already exists"; exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build release binaries
        run: |
          make release VERSION="${{ inputs.version }}"
          ls -lh dist/

      # Fallback #1: the CHANGELOG entry for this version, if one exists.
      - name: Extract CHANGELOG entry (fallback notes)
        run: |
          set -euo pipefail
          awk -v ver="${{ inputs.version }}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## \[/              { exit }
            found                          { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes-changelog.md" || true
          if [ -s "$RUNNER_TEMP/notes-changelog.md" ]; then
            echo "changelog entry found for ${{ inputs.version }}"
          else
            echo "::notice::No CHANGELOG entry for ${{ inputs.version }} — final fallback is GitHub auto-notes."
          fi

      # Primary notes: ledger (https://github.com/anishhs-gh/ledger) reads the
      # commits and diffs since the previous tag and writes the notes. For the
      # first release it uses the root commit. Any failure falls through to the
      # CHANGELOG entry / auto-notes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate release notes with ledger
        env:
          LEDGER_PROVIDER: bedrock
          LEDGER_MODEL: ${{ vars.LEDGER_MODEL }} # optional; empty = provider default
          BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }} # optional; ledger defaults to us-east-1
        run: |
          set -uo pipefail
          notes="$RUNNER_TEMP/release-notes.md"

          fallback() {
            echo "::warning::$1 — falling back."
            if [ -s "$RUNNER_TEMP/notes-changelog.md" ]; then
              cp "$RUNNER_TEMP/notes-changelog.md" "$notes"
            else
              : > "$notes" # empty file → gh will use --generate-notes
            fi
          }

          if [ -z "${BEDROCK_API_KEY:-}" ]; then
            fallback "BEDROCK_API_KEY secret not set"
            exit 0
          fi

          prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            from="$prev"
            echo "Generating notes for ${from}..HEAD"
          else
            from="$(git rev-list --max-parents=0 HEAD | tail -1)"
            echo "First release — generating notes for root (${from})..HEAD"
          fi

          if npx --yes @anishhs/ledger@1 generate \
               --from "$from" --to HEAD \
               --output-file "$notes" --quiet \
             && [ -s "$notes" ]; then
            echo "ledger notes generated."
          else
            fallback "ledger note generation failed"
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          notes="$RUNNER_TEMP/release-notes.md"

          flags=""
          [[ "${{ inputs.dist-tag }}" == "beta" ]] && flags="--prerelease"
          if [ -s "$notes" ]; then
            flags="$flags --notes-file $notes"
          else
            flags="$flags --generate-notes"
          fi

          # gh creates the tag at the released commit as part of the release.
          # Only the built binaries + checksums are attached. install.sh /
          # uninstall.sh are NOT release assets: they always target the latest
          # release (or an explicit --version), so a copy pinned inside one
          # release would be misleading. Users get them from source — the
          # raw.githubusercontent one-liner or a clone.
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "canvux $VERSION" \
            $flags \
            dist/*
